[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ysudoku"
version = "0.27.9"
description = "See why every digit is right: explainable, animated variant sudoku solver for SudokuPad links"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YSudoku contributors" }]
keywords = ["sudoku", "variant-sudoku", "sudokupad", "explainable", "solver"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Games/Entertainment :: Puzzle Games",
]

[project.urls]
Homepage = "https://github.com/CodeInDreams/ysudoku"
Repository = "https://github.com/CodeInDreams/ysudoku"
Issues = "https://github.com/CodeInDreams/ysudoku/issues"

[project.optional-dependencies]
global-clues = ["ortools>=9.10"]

[project.scripts]
ysudoku = "ysudoku.cli:main"

[tool.setuptools.packages.find]
include = ["ysudoku*"]

[tool.setuptools.package-data]
ysudoku = ["static/*"]
